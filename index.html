<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* CSS स्टाइलिंग */
        body {
            font-family: 'Teko', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #000015;
            color: #ffffff;
            text-align: center;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        #fireworks-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
        }

        #intro-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 21, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 1s ease-out;
        }
        #intro-overlay h1 {
            font-size: 5em; color: #FFD700;
            text-shadow: 0 0 20px #FF8C00; margin: 0;
        }
        #intro-overlay p {
            font-size: 2em; color: #FF9933;
            margin-top: 10px; animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .container {
            position: relative; z-index: 1; max-width: 600px;
            margin: auto; background: rgba(15, 12, 41, 0.8);
            backdrop-filter: blur(10px); border-radius: 20px;
            padding: 25px; border: 2px solid;
            border-image: linear-gradient(45deg, #FFD700, #FF6347) 1;
            box-shadow: 0 0 30px rgba(255, 223, 186, 0.4);
        }

        #greeting {
            font-size: 4em; font-weight: 700; color: #FFD700;
            margin-bottom: 20px; line-height: 1.2;
            text-shadow: 0 0 10px #FFD700, 0 0 20px #FF8C00;
            display: none; animation: fadeInGlow 2s ease-in-out forwards;
        }
        #greeting .from-text {
            display: block; font-size: 0.5em;
            color: #FFC0CB; font-weight: 400;
        }
        @keyframes fadeInGlow {
            from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        #video-title {
            font-size: 2.2em; color: #FF9933;
            margin-bottom: 20px; font-weight: 700;
            text-shadow: 0 0 5px rgba(255, 153, 51, 0.7);
        }

        video {
            width: 100%; max-width: 100%;
            border-radius: 10px; border: 3px solid #FFD700;
            margin-bottom: 20px;
        }
        
        /* नया शुभकामना संदेश (वीडियो के नीचे) */
        #sender-message {
            font-size: 2.5em;
            color: #FFC0CB; /* गुलाबी रंग */
            margin: 20px 0;
            font-weight: 700;
            text-shadow: 0 0 10px #ff00ff;
            display: none; /* डिफ़ॉल्ट रूप से छिपा हुआ */
        }

        .input-container h3 {
            font-size: 2em; color: #FF9933;
            margin-bottom: 20px;
        }
        
        #nameInput {
            padding: 15px 25px; width: 100%;
            border-radius: 15px; border: 2px solid #FFD700;
            font-size: 1.5em; background-color: rgba(0, 0, 0, 0.4);
            color: white; font-family: 'Teko', sans-serif;
            box-sizing: border-box; margin-bottom: 15px;
            text-align: center;
        }
        #nameInput::placeholder { color: #ddd; }
        
        button {
            padding: 15px 25px; width: 100%; border: none;
            background: linear-gradient(45deg, #25D366, #128C7E);
            color: white; font-size: 1.6em; font-weight: bold;
            cursor: pointer; border-radius: 50px;
            transition: all 0.3s ease; font-family: 'Teko', sans-serif;
            box-sizing: border-box; display: inline-flex;
            align-items: center; justify-content: center;
        }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px #25D366;
        }
        button svg {
            width: 28px; height: 28px;
            margin-right: 15px;
        }

        #linkResult {
            margin-top: 20px; padding: 15px;
            border-radius: 10px; display: none;
        }
        #generatedLink {
            width: 100%; padding: 10px;
            background-color: rgba(0,0,0,0.3); color: #FFD700;
            border: 1px dashed #FFD700; border-radius: 5px;
            font-size: 1.1em; text-align: center;
            word-wrap: break-word; box-sizing: border-box;
        }
    </style>
</head>
<body>
    
    <div id="intro-overlay">
        <h1>शुभ दीपावली</h1>
        <p>🪔 प्रवेश करने के लिए टैप करें 🪔</p>
    </div>

    <canvas id="fireworks-canvas"></canvas>

    <div class="container">
        <div id="greeting"></div>

        <h2 id="video-title"> ✨Happy Diwali🪔🪔 </h2>

        <video controls autoplay loop muted playsinline>
            <source src="diwali-video.mp4" type="video/mp4">
            आपका ब्राउज़र वीडियो टैग को सपोर्ट नहीं करता।
        </video>

        <!-- यह संदेश जावास्क्रिप्ट द्वारा भरा जाएगा -->
        <h3 id="sender-message"></h3>

        <div class="input-container">
            <h3>✨ आप भी अपना नाम लिख कर किसी को भेज सकते हैं  ✨</h3>
            <input type="text" id="nameInput" placeholder="यहाँ अपना नाम लिखें...">
            <button onclick="generateLink()">
                <svg viewBox="0 0 32 32" fill="white" width="24" height="24"><path d=" M19.11 17.205c-.372 0-1.088 1.39-1.518 1.39a.63.63 0 0 1-.315-.1c-.802-.402-1.504-.817-2.163-1.447-.545-.516-1.146-1.29-1.46-1.963a.426.426 0 0 1-.073-.215c0-.33.99-.945.99-1.49 0-.143-.73-2.09-.832-2.335-.143-.372-.214-.487-.6-.487-.187 0-.36-.044-.53-.044-.302 0-.53.115-.746.315-.688.645-1.032 1.318-1.06 2.264v.114c-.015.99.472 1.977 1.017 2.78 1.23 1.82 2.506 3.41 4.554 4.34.616.287 2.035.888 2.722.888.817 0 2.15-.515 2.478-1.318.12-.302.214-.72.214-1.146 0-.426-.044-1.13-.22-1.318-.16-.187-.36-.22-.6-.22m-7.48 9.252a10.954 10.954 0 0 1-5.55-1.523l-1.636.85.877-1.572a11.127 11.127 0 0 1-1.72-6.192c0-6.115 4.96-11.075 11.074-11.075 6.116 0 11.074 4.96 11.074 11.074 0 6.116-4.958 11.075-11.074 11.075Z M12.01 4.37a9.73 9.73 0 0 0-8.23 15.14l1.35 2.5-2.6 1.44a1.23 1.23 0 0 1-1.56-1.56l1.44-2.6-2.5-1.35A9.73 9.73 0 0 0 12.01 4.37z"/></svg>
                शेयर करें
            </button>
        </div>
        
        <div id="linkResult">
            <p>आपका ब्राउज़र ऑटो-शेयरिंग का समर्थन नहीं करता। कृपया इस लिंक को कॉपी करके साझा करें:</p>
            <input type="text" id="generatedLink" readonly onclick="this.select()">
        </div>
    </div>
    
    <audio src="diwali-song.mp3" loop id="bg-music"></audio>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const senderName = urlParams.get('from');

            if (senderName) {
                // शीर्ष पर ग्रीटिंग दिखाएं
                const greetingElement = document.getElementById('greeting');
                greetingElement.innerHTML = `Happy Diwali<span class="from-text">From: ${decodeURIComponent(senderName)}</span>`;
                greetingElement.style.display = 'block';

                // वीडियो के नीचे व्यक्तिगत संदेश दिखाएं
                const senderMessageElement = document.getElementById('sender-message');
                senderMessageElement.textContent = `✨ ${decodeURIComponent(senderName)} की तरफ से आपको और आपके परिवार को 🪔Happy Diwali🪔 ✨`;
                senderMessageElement.style.display = 'block';
            }

            const overlay = document.getElementById('intro-overlay');
            const music = document.getElementById('bg-music');
            
            overlay.addEventListener('click', () => {
                music.play();
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 1000);
            }, { once: true });
        };

        async function generateLink() {
            const nameInput = document.getElementById('nameInput');
            const senderName = nameInput.value.trim();
            if (senderName === "") {
                alert("कृपया अपना नाम दर्ज करें!");
                return;
            }
            const baseUrl = window.location.origin + window.location.pathname;
            const newLink = `${baseUrl}?from=${encodeURIComponent(senderName)}`;
            
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'दिवाली की शुभकामनाएं!',
                        text: `${senderName} ने आपको दिवाली की शुभकामनाएं भेजी हैं! ✨🪔\n\nउनका संदेश देखने के लिए लिंक पर क्लिक करें:`,
                        url: newLink,
                    });
                } catch (error) { showLinkFallback(newLink); }
            } else {
                showLinkFallback(newLink);
            }
        }
        
        function showLinkFallback(link) {
            const linkResultDiv = document.getElementById('linkResult');
            const generatedLinkInput = document.getElementById('generatedLink');
            generatedLinkInput.value = link;
            linkResultDiv.style.display = 'block';
            generatedLinkInput.select();
            generatedLinkInput.setSelectionRange(0, 99999);
        }

        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let fireworks = [], particles = [];
        function Firework(sx, sy, tx, ty) { this.x = sx; this.y = sy; this.sx = sx; this.sy = sy; this.tx = tx; this.ty = ty; this.distanceToTarget = Math.sqrt(Math.pow(tx - sx, 2) + Math.pow(ty - sy, 2)); this.distanceTraveled = 0; this.coordinates = []; this.coordinateCount = 3; while (this.coordinateCount--) { this.coordinates.push([this.x, this.y]); } this.angle = Math.atan2(ty - sy, tx - sx); this.speed = 2; this.acceleration = 1.05; this.brightness = Math.random() * 50 + 50; this.targetRadius = 1; }
        Firework.prototype.update = function(index) { this.coordinates.pop(); this.coordinates.unshift([this.x, this.y]); if (this.targetRadius < 8) { this.targetRadius += 0.3; } else { this.targetRadius = 1; } this.speed *= this.acceleration; const vx = Math.cos(this.angle) * this.speed; const vy = Math.sin(this.angle) * this.speed; this.distanceTraveled = Math.sqrt(Math.pow(this.x - this.sx, 2) + Math.pow(this.y - this.sy, 2)); if (this.distanceTraveled >= this.distanceToTarget) { createParticles(this.tx, this.ty); fireworks.splice(index, 1); } else { this.x += vx; this.y += vy; } };
        Firework.prototype.draw = function() { ctx.beginPath(); ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]); ctx.lineTo(this.x, this.y); ctx.strokeStyle = `hsl(${Math.random() * 360}, 100%, ${this.brightness}%)`; ctx.stroke(); };
        function Particle(x, y) { this.x = x; this.y = y; this.coordinates = []; this.coordinateCount = 5; while (this.coordinateCount--) { this.coordinates.push([this.x, this.y]); } this.angle = Math.random() * Math.PI * 2; this.speed = Math.random() * 10 + 1; this.friction = 0.95; this.gravity = 1; this.hue = Math.random() * 50 + 30; this.brightness = Math.random() * 50 + 50; this.alpha = 1; this.decay = Math.random() * 0.03 + 0.015; }
        Particle.prototype.update = function(index) { this.coordinates.pop(); this.coordinates.unshift([this.x, this.y]); this.speed *= this.friction; this.x += Math.cos(this.angle) * this.speed; this.y += Math.sin(this.angle) * this.speed + this.gravity; this.alpha -= this.decay; if (this.alpha <= this.decay) { particles.splice(index, 1); } };
        Particle.prototype.draw = function() { ctx.beginPath(); ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]); ctx.lineTo(this.x, this.y); ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`; ctx.stroke(); };
        function createParticles(x, y) { let particleCount = 40; while (particleCount--) { particles.push(new Particle(x, y)); } }
        function loop() {
            requestAnimationFrame(loop);
            ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0, 0, 0, 0.5)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.globalCompositeOperation = 'lighter';
            let i = fireworks.length; while (i--) { fireworks[i].draw(); fireworks[i].update(i); }
            let j = particles.length; while (j--) { particles[j].draw(); particles[j].update(j); }
            if (Math.random() < 0.35) { fireworks.push(new Firework(Math.random() * canvas.width, canvas.height, Math.random() * canvas.width, Math.random() * canvas.height / 2)); }
        }
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        loop();
    </script>
</body>
</html>
